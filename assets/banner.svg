<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <radialGradient id="mesh-glow-1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="mesh-glow-2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <!-- Filter for soft blur & glow -->
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .gradient-title {
        fill: url(#primary-glow);
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 17px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #cbd5e1;
      }

      /* Animated Elements in Background */
      @keyframes floatParticle {
        0% { transform: translateY(0px) scale(1); opacity: 0.3; }
        50% { transform: translateY(-25px) scale(1.15); opacity: 0.7; }
        100% { transform: translateY(0px) scale(1); opacity: 0.3; }
      }
      @keyframes pulseGlow {
        0% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(1.08); }
        100% { opacity: 0.25; transform: scale(1); }
      }
      @keyframes flowOrbit {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -400; }
      }
      @keyframes pillBob {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }

      .p-1 { animation: floatParticle 6s ease-in-out infinite; }
      .p-2 { animation: floatParticle 8s ease-in-out 1s infinite; }
      .p-3 { animation: floatParticle 7s ease-in-out 2s infinite; }
      .mesh-pulse { animation: pulseGlow 10s ease-in-out infinite; transform-origin: center; }
      .stream-line {
        stroke-dasharray: 12, 16;
        animation: flowOrbit 12s linear infinite;
      }
      .pill-float-1 { animation: pillBob 5s ease-in-out infinite; }
      .pill-float-2 { animation: pillBob 6s ease-in-out 1.5s infinite; }
      .pill-float-3 { animation: pillBob 5.5s ease-in-out 3s infinite; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" rx="16" fill="url(#bg-grad)" />

  <!-- Dynamic Glowing Backdrop Meshes -->
  <g class="mesh-pulse">
    <circle cx="240" cy="100" r="180" fill="url(#mesh-glow-1)" filter="url(#blur-glow)" />
    <circle cx="960" cy="220" r="200" fill="url(#mesh-glow-2)" filter="url(#blur-glow)" />
  </g>

  <!-- Subtle Neural / Network Flow Lines in Background -->
  <g opacity="0.35">
    <path class="stream-line" d="M 50 280 C 300 200, 450 320, 700 260 S 1000 120, 1150 160" fill="none" stroke="#6366f1" stroke-width="1.5" />
    <path class="stream-line" d="M 80 80 C 250 140, 500 40, 750 110 S 1050 240, 1120 280" fill="none" stroke="#a855f7" stroke-width="1.5" style="animation-duration: 16s;" />
  </g>

  <!-- Ambient Dynamic Floating Tech Pills in Midground (Out of Way of Text) -->
  <g class="pill-float-1" transform="translate(900, 45)">
    <rect width="180" height="34" rx="17" fill="url(#card-grad)" stroke="#6366f1" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="18" cy="17" r="5" fill="#10b981" />
    <text x="32" y="22" class="badge-text">⚡ Agent-Native MCP</text>
  </g>

  <g class="pill-float-2" transform="translate(930, 95)">
    <rect width="160" height="34" rx="17" fill="url(#card-grad)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="18" cy="17" r="5" fill="#ec4899" />
    <text x="32" y="22" class="badge-text">🧠 NLP Pipelines</text>
  </g>

  <g class="pill-float-3" transform="translate(870, 145)">
    <rect width="210" height="34" rx="17" fill="url(#card-grad)" stroke="#ec4899" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="18" cy="17" r="5" fill="#6366f1" />
    <text x="32" y="22" class="badge-text">✍️ Paraphrasing &amp; Grammar</text>
  </g>

  <!-- Subtle Floating Node Particles -->
  <circle class="p-1" cx="150" cy="70" r="4" fill="#a855f7" />
  <circle class="p-2" cx="80" cy="220" r="3" fill="#6366f1" />
  <circle class="p-3" cx="720" cy="50" r="3.5" fill="#ec4899" />
  <circle class="p-1" cx="1120" cy="210" r="4" fill="#10b981" />

  <!-- Foreground Title and Core Branding -->
  <g transform="translate(80, 0)">
    <!-- Top Super-header tag -->
    <g transform="translate(0, 68)">
      <rect width="210" height="26" rx="13" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1" />
      <text x="14" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="11" fill="#818cf8" letter-spacing="1.2">CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" class="title-text">
      Awesome <tspan class="gradient-title">AI Writing</tspan> &amp; Text Processing
    </text>

    <!-- Subtitle / Meta Description -->
    <text x="0" y="188" class="subtitle-text">
      The authoritative index of enterprise SaaS solutions &amp; high-performance open-source libraries.
    </text>
    <text x="0" y="214" class="subtitle-text">
      From LLM paraphrasing &amp; grammar engines to agent-native document word processors.
    </text>

    <!-- Key Tech Badges at Bottom of Banner -->
    <g transform="translate(0, 252)">
      <!-- Badge 1 -->
      <g>
        <rect width="115" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="19" class="badge-text">✦ Grammarly</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(125, 0)">
        <rect width="105" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="19" class="badge-text">✦ Notion AI</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(240, 0)">
        <rect width="135" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="19" class="badge-text">✦ Transformers</text>
      </g>
      <!-- Badge 4 -->
      <g transform="translate(385, 0)">
        <rect width="90" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="19" class="badge-text">✦ spaCy</text>
      </g>
      <!-- Badge 5 -->
      <g transform="translate(485, 0)">
        <rect width="125" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="19" class="badge-text">✦ LanguageTool</text>
      </g>
      <!-- Badge 6 -->
      <g transform="translate(620, 0)">
        <rect width="115" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="19" class="badge-text">✦ WordCraft</text>
      </g>
    </g>
  </g>
</svg>
